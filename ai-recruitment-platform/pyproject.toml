[project]
name = "ai-recruitment-platform"
version = "1.0.0"
description = "Production-ready AI Recruitment Sourcing Agent Platform"
requires-python = ">=3.11"
dependencies = [
    # Core AI & LangChain
    "langchain>=0.2.1",
    "langchain-openai>=0.1.7",
    "langchain-anthropic>=0.1.13",
    "langchain-community>=0.2.1",
    "langgraph>=0.1.1",
    "openai>=1.29.0",
    "anthropic>=0.28.0",
    # Web Framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "python-multipart>=0.0.9",
    # Databases
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "motor>=3.4.0",
    "redis>=5.0.4",
    # Messaging
    "kafka-python>=2.0.2",
    # Vector Store
    "pinecone-client>=3.2.2",
    # AI/ML
    "numpy>=1.26.4",
    "scikit-learn>=1.5.0",
    "tiktoken>=0.7.0",
    # HTTP
    "httpx>=0.27.0",
    "aiohttp>=3.9.5",
    "beautifulsoup4>=4.12.3",
    "playwright>=1.44.0",
    # Document Processing
    "pypdf2>=3.0.1",
    "python-docx>=1.1.2",
    # Security
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1.3",
    "passlib>=1.7.4",
    # Observability
    "structlog>=24.1.0",
    "sentry-sdk[fastapi]>=2.1.1",
    "prometheus-client>=0.20.0",
    # Utilities
    "python-dotenv>=1.0.1",
    "boto3>=1.34.106",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "black>=24.4.2",
    "isort>=5.13.2",
    "flake8>=7.0.0",
    "mypy>=1.10.0",
    "bandit>=1.7.8",
    "safety>=3.1.0",
    "factory-boy>=3.3.0",
    "faker>=25.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "migrations"

[tool.isort]
profile = "black"
line_length = 100
known_third_party = ["fastapi", "pydantic", "sqlalchemy", "langchain"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
omit = ["tests/*", "migrations/*", "scripts/*"]
