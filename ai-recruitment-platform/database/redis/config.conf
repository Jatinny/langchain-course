# =============================================================================
# Redis Configuration — AI Recruitment Platform
# Optimized for: Rate limiting, session caching, pub/sub, job queue
# =============================================================================

# ── Network ───────────────────────────────────────────────────────────────────
bind 0.0.0.0
port 6379
protected-mode yes
tcp-backlog 511
timeout 300
tcp-keepalive 60

# ── Memory ────────────────────────────────────────────────────────────────────
maxmemory 2gb
maxmemory-policy allkeys-lru
maxmemory-samples 10
active-expire-enabled yes
active-expire-effort 1

# ── Persistence (RDB) ─────────────────────────────────────────────────────────
# Save if at least 1 key changed in the last 900 seconds
save 900 1
# Save if at least 10 keys changed in the last 300 seconds
save 300 10
# Save if at least 10000 keys changed in the last 60 seconds
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# ── Persistence (AOF) — append-only log for durability ───────────────────────
appendonly yes
appendfilename "appendonly.aof"
# fsync every second — good balance between performance and durability
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# ── Replication ───────────────────────────────────────────────────────────────
# replica-serve-stale-data yes
# replica-read-only yes
# repl-diskless-sync yes
# repl-diskless-sync-delay 5

# ── Security ──────────────────────────────────────────────────────────────────
# requirepass is injected via environment variable REDIS_PASSWORD at runtime
# Rename dangerous commands
rename-command FLUSHDB  ""
rename-command FLUSHALL ""
rename-command DEBUG    ""
rename-command CONFIG   "CONFIG_RECRUITAI_INTERNAL"

# ── Keyspace Notifications ────────────────────────────────────────────────────
# Enable notifications for expired keys (Ex) and key events (K)
# Used by the outreach engine to trigger scheduled message sends
notify-keyspace-events "KEx"

# ── Slow Log ─────────────────────────────────────────────────────────────────
slowlog-log-slower-than 10000
slowlog-max-len 128

# ── Latency Monitoring ────────────────────────────────────────────────────────
latency-monitor-threshold 100
latency-tracking yes
latency-tracking-info-percentiles 50 99 99.9

# ── Client Output Buffer Limits ───────────────────────────────────────────────
# Normal clients
client-output-buffer-limit normal 0 0 0
# Pub/Sub clients: 256mb hard limit, 64mb soft limit for 60 seconds
client-output-buffer-limit pubsub 256mb 64mb 60
# Replica clients
client-output-buffer-limit replica 256mb 64mb 60

# ── Connection Limits ─────────────────────────────────────────────────────────
maxclients 10000

# ── Threading (Redis 6+) ──────────────────────────────────────────────────────
io-threads 4
io-threads-do-reads yes

# ── Lua scripting ─────────────────────────────────────────────────────────────
lua-time-limit 5000

# ── Lazy freeing ─────────────────────────────────────────────────────────────
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# ── Logging ───────────────────────────────────────────────────────────────────
loglevel notice
logfile /var/log/redis/redis-server.log

# ── Pub/Sub ────────────────────────────────────────────────────────────────────
# Used channels:
#   recruitment:outreach:queue   — new outreach tasks
#   recruitment:events           — platform events for analytics
#   recruitment:notifications    — real-time user notifications
#   recruitment:ai:results       — AI processing results
#   recruitment:cache:invalidate — cache invalidation signals

# ── Database layout ───────────────────────────────────────────────────────────
# DB 0: Rate limiting (sliding window counters, TTL-based)
# DB 1: Session / JWT cache
# DB 2: Application cache (employers, jobs, candidates)
# DB 3: Outreach queue & scheduling
# DB 4: AI response cache (embeddings, completions)
# DB 5: Pub/Sub message buffer
databases 16

# ── Active defragmentation ────────────────────────────────────────────────────
activedefrag yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100
active-defrag-cycle-min 1
active-defrag-cycle-max 25

# ── RDB/AOF hybrid ────────────────────────────────────────────────────────────
rdb-save-incremental-fsync yes
aof-rewrite-incremental-fsync yes

# ── Cluster (disabled for single-node / comment in for cluster mode) ──────────
# cluster-enabled yes
# cluster-config-file nodes.conf
# cluster-node-timeout 15000
# cluster-announce-ip <POD_IP>
# cluster-announce-port 6379
# cluster-announce-bus-port 16379
