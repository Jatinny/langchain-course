name: CI Pipeline

on:
  push:
    branches: [main, develop, "feature/**", "claude/**"]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  lint-python:
    name: Python Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint dependencies
        run: pip install black isort flake8 mypy bandit safety

      - name: Black format check
        run: black --check --line-length=100 .

      - name: isort check
        run: isort --check-only --profile=black .

      - name: Flake8 lint
        run: flake8 . --max-line-length=100 --exclude=migrations,__pycache__,.venv

      - name: Bandit security scan
        run: bandit -r agents/ services/ common/ -x tests/ -ll

  lint-frontend:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

  test:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: lint-python
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: recruitment_test
          POSTGRES_USER: recruitment
          POSTGRES_PASSWORD: recruitment
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r common/requirements.txt pip install pytest pytest-asyncio pytest-cov httpx factory-boy faker aiosqlite

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://recruitment:recruitment@localhost:5432/recruitment_test
          REDIS_URL: redis://localhost:6379
          OPENAI_API_KEY: sk-test-fake-key
          ANTHROPIC_API_KEY: sk-ant-test-fake-key
          JWT_SECRET_KEY: test-secret-key-minimum-32-chars-long
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          PINECONE_API_KEY: test-key
          ENVIRONMENT: test
        run: pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install safety
        run: pip install safety

      - name: Safety dependency check
        run: safety check -r common/requirements.txt || true

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [lint-python, test]
    strategy:
      matrix:
        service:
          - employer_discovery
          - recruiter_intelligence
          - outreach_engine
          - candidate_matching
          - crm_service
          - analytics_service
          - api_gateway
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          tags: ${{ matrix.service }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: lint-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Build Next.js app
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint-python, test, docker-build, frontend-build]
    if: failure() && github.ref == 'refs/heads/main'
    steps:
      - name: Slack Notification
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {"text": "❌ CI Failed on main — ${{ github.actor }} — ${{ github.event.head_commit.message }}"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
