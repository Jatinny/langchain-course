version: "3.9"

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
  data-net:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  elasticsearch_data:
  kafka_data:
  zookeeper_data:

services:
  # ============== Infrastructure ==============
  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recruitment
      POSTGRES_USER: recruitment
      POSTGRES_PASSWORD: recruitment
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks: [data-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruitment"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: recruitment
    volumes:
      - mongodb_data:/data/db
    networks: [data-net]
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
      - ./database/redis/config.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks: [data-net, backend-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks: [data-net]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks: [data-net, backend-net]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: "false"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks: [data-net, backend-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============== Application Services ==============
  api-gateway:
    build:
      context: .
      dockerfile: services/api_gateway/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      redis: {condition: service_healthy}
    networks: [frontend-net, backend-net]

  employer-discovery:
    build:
      context: .
      dockerfile: services/employer_discovery/Dockerfile
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://recruitment:recruitment@postgresql:5432/recruitment
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgresql: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [backend-net, data-net]

  recruiter-intelligence:
    build:
      context: .
      dockerfile: services/recruiter_intelligence/Dockerfile
    ports:
      - "8002:8002"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://recruitment:recruitment@postgresql:5432/recruitment
      REDIS_URL: redis://redis:6379
    depends_on:
      postgresql: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [backend-net, data-net]

  outreach-engine:
    build:
      context: .
      dockerfile: services/outreach_engine/Dockerfile
    ports:
      - "8003:8003"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://recruitment:recruitment@postgresql:5432/recruitment
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgresql: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [backend-net, data-net]

  candidate-matching:
    build:
      context: .
      dockerfile: services/candidate_matching/Dockerfile
    ports:
      - "8004:8004"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://recruitment:recruitment@postgresql:5432/recruitment
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgresql: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [backend-net, data-net]

  crm-service:
    build:
      context: .
      dockerfile: services/crm_service/Dockerfile
    ports:
      - "8005:8005"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://recruitment:recruitment@postgresql:5432/recruitment
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgresql: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [backend-net, data-net]

  analytics-service:
    build:
      context: .
      dockerfile: services/analytics_service/Dockerfile
    ports:
      - "8006:8006"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://recruitment:recruitment@postgresql:5432/recruitment
      REDIS_URL: redis://redis:6379
    depends_on:
      postgresql: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [backend-net, data-net]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api-gateway:8000
    depends_on: [api-gateway]
    networks: [frontend-net]

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [api-gateway, frontend]
    networks: [frontend-net]

  # ============== Observability ==============
  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/docker/alerting_rules.yml:/etc/prometheus/rules/alerts.yml:ro
    networks: [backend-net]

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/docker/grafana-dashboard.json:/var/lib/grafana/dashboards/recruitment.json:ro
    networks: [backend-net]
