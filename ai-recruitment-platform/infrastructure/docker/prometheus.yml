global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production
    platform: ai-recruitment

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: [api-gateway:8000]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: employer-discovery
    metrics_path: /metrics
    static_configs:
      - targets: [employer-discovery:8001]

  - job_name: recruiter-intelligence
    metrics_path: /metrics
    static_configs:
      - targets: [recruiter-intelligence:8002]

  - job_name: outreach-engine
    metrics_path: /metrics
    static_configs:
      - targets: [outreach-engine:8003]

  - job_name: candidate-matching
    metrics_path: /metrics
    static_configs:
      - targets: [candidate-matching:8004]

  - job_name: crm-service
    metrics_path: /metrics
    static_configs:
      - targets: [crm-service:8005]

  - job_name: analytics-service
    metrics_path: /metrics
    static_configs:
      - targets: [analytics-service:8006]

  - job_name: postgresql
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]

  - job_name: kafka
    static_configs:
      - targets: [kafka-exporter:9308]

  - job_name: node-exporter
    static_configs:
      - targets: [node-exporter:9100]
