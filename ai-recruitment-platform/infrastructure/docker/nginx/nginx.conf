# =============================================================================
# Nginx Reverse Proxy — AI Recruitment Platform
# =============================================================================

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging format ──────────────────────────────────────────────────────
    log_format json_combined escape=json
        '{'
        '"time_iso8601":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"request_id":"$request_id",'
        '"request":"$request",'
        '"status":"$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"upstream_addr":"$upstream_addr"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # ── Performance ─────────────────────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   75s;
    keepalive_requests  1000;
    reset_timedout_connection on;

    # ── Buffers ─────────────────────────────────────────────────────────────
    client_body_buffer_size    16k;
    client_header_buffer_size  4k;
    client_max_body_size       50m;
    large_client_header_buffers 4 8k;

    # ── Gzip Compression ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/vnd.ms-fontobject
        application/wasm
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/calendar
        text/css
        text/javascript
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy
        text/xml;

    # ── Rate limiting zones ─────────────────────────────────────────────────
    # Zone for general API requests (10 req/s per IP = 600/min)
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=10r/s;
    # Stricter zone for auth endpoints
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;
    # Zone for static files
    limit_req_zone $binary_remote_addr zone=static_limit:5m rate=50r/s;

    limit_req_status 429;
    limit_conn_status 429;

    # ── Connection limits per IP ────────────────────────────────────────────
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    limit_conn conn_limit_per_ip 100;

    # ── Upstream: API Gateway ────────────────────────────────────────────────
    upstream api_gateway {
        least_conn;
        server api-gateway:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ── Upstream: Individual services (for direct service access if needed) ──
    upstream employer_discovery {
        server employer-discovery:8001 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream recruiter_intelligence {
        server recruiter-intelligence:8002 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream outreach_engine {
        server outreach-engine:8003 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream candidate_matching {
        server candidate-matching:8004 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream crm_service {
        server crm-service:8005 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream analytics_service {
        server analytics-service:8006 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # ── Request ID generation ────────────────────────────────────────────────
    map $http_x_request_id $request_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    # ── HTTP → HTTPS redirect ────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Main HTTPS server ────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name app.recruitai.io api.recruitai.io;

        # ── SSL ──────────────────────────────────────────────────────────────
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache   shared:SSL:50m;
        ssl_session_tickets off;

        # Modern SSL config
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;

        # HSTS
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # OCSP stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/nginx/ssl/chain.pem;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # ── Security Headers ─────────────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.recruitai.io wss://api.recruitai.io;" always;
        add_header X-Request-ID $request_id always;

        # ── Static files ─────────────────────────────────────────────────────
        location /static/ {
            root /var/www/html;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff;
            limit_req zone=static_limit burst=100 nodelay;
            access_log off;

            # Serve pre-compressed files if available
            gzip_static on;
        }

        location /favicon.ico {
            root /var/www/html/static;
            expires 30d;
            access_log off;
        }

        # ── Auth endpoints (stricter rate limiting) ──────────────────────────
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-ID $request_id;
            proxy_set_header   Connection "";
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }

        # ── API routes → API Gateway ─────────────────────────────────────────
        location /api/v1/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-ID $request_id;
            proxy_set_header   Connection "";
            proxy_read_timeout 120s;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;

            # Buffer settings for large responses (resume downloads, etc.)
            proxy_buffer_size           16k;
            proxy_buffers               8 32k;
            proxy_busy_buffers_size     64k;

            # Error handling
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 30s;

            # Cache control headers passthrough
            proxy_hide_header X-Powered-By;
        }

        # ── WebSocket support for real-time notifications ────────────────────
        location /ws/ {
            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Health check (no rate limiting) ──────────────────────────────────
        location /health {
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        # ── Metrics (restrict to internal networks) ───────────────────────────
        location /metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://api_gateway;
            access_log off;
        }

        # ── Docs ─────────────────────────────────────────────────────────────
        location /docs {
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Default: Serve React SPA ─────────────────────────────────────────
        location / {
            root /var/www/html;
            try_files $uri $uri/ /index.html;
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # ── Error pages ──────────────────────────────────────────────────────
        error_page 404              /404.html;
        error_page 429              /429.html;
        error_page 500 502 503 504  /50x.html;

        location = /50x.html {
            root /var/www/html/error;
        }
    }
}
