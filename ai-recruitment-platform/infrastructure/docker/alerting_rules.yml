groups:
  - name: recruitment_platform_alerts
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Service {{ $labels.job }} has been down for more than 1 minute."

      - alert: HighErrorRate
        expr: |
          rate(http_requests_total{status_code=~"5.."}[5m]) /
          rate(http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on {{ $labels.service }}"
          description: "Error rate is {{ $value | humanizePercentage }} on {{ $labels.service }}"

      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2.0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency on {{ $labels.service }}"
          description: "p95 latency is {{ $value }}s on {{ $labels.service }}"

      - alert: DatabaseConnectionPoolExhausted
        expr: |
          pg_stat_activity_count > 80
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL connection pool near limit"

      - alert: KafkaLag
        expr: |
          kafka_consumer_group_lag > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Kafka consumer lag in group {{ $labels.consumergroup }}"

      - alert: RedisMemoryHigh
        expr: |
          redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage above 85%"

      - alert: LowPlacementRate
        expr: |
          rate(placements_made_total[24h]) < 0.1
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "Low placement rate detected"
          description: "Consider reviewing candidate matching quality and outreach effectiveness"
