---
apiVersion: v1
kind: Namespace
metadata:
  name: ai-recruitment
  labels:
    name: ai-recruitment
    environment: production
    managed-by: terraform
    team: platform

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ai-recruitment-quota
  namespace: ai-recruitment
spec:
  hard:
    # Compute
    requests.cpu: "40"
    requests.memory: "80Gi"
    limits.cpu: "80"
    limits.memory: "160Gi"
    # Storage
    requests.storage: "500Gi"
    persistentvolumeclaims: "30"
    # Objects
    pods: "200"
    services: "50"
    configmaps: "100"
    secrets: "100"
    deployments.apps: "30"
    replicasets.apps: "60"
    statefulsets.apps: "15"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: ai-recruitment-limits
  namespace: ai-recruitment
spec:
  limits:
    # Default limits for containers that don't specify
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      max:
        cpu: "8"
        memory: "16Gi"
      min:
        cpu: "50m"
        memory: "64Mi"
    # Pod limits
    - type: Pod
      max:
        cpu: "16"
        memory: "32Gi"
    # PVC limits
    - type: PersistentVolumeClaim
      max:
        storage: "100Gi"
      min:
        storage: "1Gi"
