# IMPORTANT: This file is a template. Actual secrets must be managed via
# AWS Secrets Manager + External Secrets Operator, NOT committed to git.
#
# To apply: kubectl apply -f secrets.yaml (after populating base64 values)
# Better: Use External Secrets Operator with AWS Secrets Manager
#
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: ai-recruitment
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: recruitment-platform-secrets
  namespace: ai-recruitment
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: recruitment-platform-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OPENAI_API_KEY: "{{ .openai_api_key }}"
        ANTHROPIC_API_KEY: "{{ .anthropic_api_key }}"
        DATABASE_URL: "{{ .database_url }}"
        MONGODB_URL: "{{ .mongodb_url }}"
        REDIS_URL: "{{ .redis_url }}"
        JWT_SECRET_KEY: "{{ .jwt_secret_key }}"
        APOLLO_API_KEY: "{{ .apollo_api_key }}"
        HUNTER_API_KEY: "{{ .hunter_api_key }}"
        PINECONE_API_KEY: "{{ .pinecone_api_key }}"
        GMAIL_CLIENT_SECRET: "{{ .gmail_client_secret }}"
        WHATSAPP_API_TOKEN: "{{ .whatsapp_api_token }}"
        SENTRY_DSN: "{{ .sentry_dsn }}"
  data:
    - secretKey: openai_api_key
      remoteRef:
        key: recruitment-platform/prod
        property: OPENAI_API_KEY
    - secretKey: anthropic_api_key
      remoteRef:
        key: recruitment-platform/prod
        property: ANTHROPIC_API_KEY
    - secretKey: database_url
      remoteRef:
        key: recruitment-platform/prod
        property: DATABASE_URL
    - secretKey: mongodb_url
      remoteRef:
        key: recruitment-platform/prod
        property: MONGODB_URL
    - secretKey: redis_url
      remoteRef:
        key: recruitment-platform/prod
        property: REDIS_URL
    - secretKey: jwt_secret_key
      remoteRef:
        key: recruitment-platform/prod
        property: JWT_SECRET_KEY
    - secretKey: apollo_api_key
      remoteRef:
        key: recruitment-platform/prod
        property: APOLLO_API_KEY
    - secretKey: hunter_api_key
      remoteRef:
        key: recruitment-platform/prod
        property: HUNTER_API_KEY
    - secretKey: pinecone_api_key
      remoteRef:
        key: recruitment-platform/prod
        property: PINECONE_API_KEY
    - secretKey: gmail_client_secret
      remoteRef:
        key: recruitment-platform/prod
        property: GMAIL_CLIENT_SECRET
    - secretKey: whatsapp_api_token
      remoteRef:
        key: recruitment-platform/prod
        property: WHATSAPP_API_TOKEN
    - secretKey: sentry_dsn
      remoteRef:
        key: recruitment-platform/prod
        property: SENTRY_DSN
